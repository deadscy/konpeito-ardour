# CI build Konpeito Ardour cho Windows (x86_64, UCRT64)
#
# Mỗi lần push lên main (hoặc bấm Run workflow thủ công), GitHub Actions sẽ:
#   1. dựng môi trường MSYS2/UCRT64 trên windows-latest
#   2. cài toolchain + toàn bộ thư viện Ardour cần (pacman, step riêng để log rõ)
#   3. ./waf configure --dist-target=mingw && ./waf
#   4. ./waf install vào thư mục staging rồi nén thành zip portable
#   5. upload zip lên Artifacts (tab Actions) để tải về
#
# LỊCH SỬ SỬA:
#  - v2 (2026-10-12): migrate MINGW64 -> UCRT64 (MINGW64 deprecated từ
#    setup-msys2 v2.33.0; warning trong lần chạy đầu). Toàn bộ package pacman
#    đổi prefix mingw-w64-x86_64- -> mingw-w64-ucrt-x86_64-; 10 package đáng ngờ
#    (vamp-plugin-sdk, aubio, drmingw, libwebsockets, rubberband, fftw,
#    fluidsynth, portaudio, hidapi, libusb) đã verify tồn tại bản ucrt64 trên
#    packages.msys2.org. actions/checkout v4->v5, upload-artifact v4->v5
#    (Node 20 deprecated); setup-msys2 giữ @v2 (đã là node24). Tách step pacman
#    riêng + set -x để log rõ package nào lỗi; upload build/config.log khi fail.
#  - v3 (2026-10-12): FIX QUAN TRỌNG từ log lỗi thật — waf trên Windows tự ưu
#    tiên phát hiện MSVC (CL.exe của Visual Studio trên runner) trước MinGW,
#    khiến check boost fail. Ép compiler bằng export CC=gcc / CXX=g++ trong
#    step configure và build.
#  - v4 (2026-10-12): FIX từ log vòng 2 — shell `msys2 {0}` KHÔNG có `-e`,
#    nên step "Show toolchain versions" với `gcc --version | head -1` đã pass
#    giả (pipe che lỗi, bash không dừng) trong khi gcc thật sự không tồn tại.
#    Thêm `set -euo pipefail` vào mọi run step để lỗi nào fail ngay ở đó,
#    lần chạy tới sẽ thấy đúng chỗ gãy đầu tiên (nghi nhất: pacman install).
#  - v5 (2026-10-12): FIX từ chẩn đoán vòng 2 — `export CC=gcc` KHÔNG có tác
#    dụng với waf: trên win32 waf luôn thử msvc -> gcc -> clang theo thứ tự
#    cứng, bỏ qua biến môi trường CC/CXX (verify trực tiếp trên source waf
#    2.0.26: compiler_c.py dùng conf.options.check_c_compiler). Ép đúng cách
#    bằng --check-c-compiler=gcc --check-cxx-compiler=g++. Thêm command -v
#    vào step toolchain để thiếu là fail ngay, đúng chỗ.
#  - v6 (2026-10-12): FIX từ log vòng 3 — XOÁ export CC=gcc / CXX=g++.
#    waf find_program() thấy $CC thì dùng luôn chuỗi đó làm path, mà
#    check_exe() trên win32 không tự thêm .exe -> "Checking for 'gcc'
#    (C compiler): not found" dù gcc.exe có trong PATH (verify trên source
#    waf 2.0.26: Configure.py find_program + Utils.check_exe).
#  - v7 (2026-10-12): FIX từ log vòng 4 — bệnh gốc thật: pacman bị rớt mạng
#    giữa chừng ở mirror ftp2.osuosl.org ("Operation too slow") -> huỷ cả
#    transaction -> KHÔNG gói nào được cài -> mất gcc. Đây mới là lý do các
#    vòng 2-3 báo thiếu compiler. Retry pacman tối đa 3 lần +
#    --disable-download-timeout.
#  - v8 (2026-10-12): FIX từ log vòng 5 — configure đã tìm thấy gcc/boost/
#    libwebsockets/exchndl.h nhưng fail ở `lv2 >= 1.2.0`. Quét toàn bộ wscript
#    thấy 5 check mandatory trong libs/ardour/wscript: lv2, serd-0, sord-0,
#    sratom-0, lilv-0 -> thêm cả 5 gói ucrt64 một lần (đã verify tồn tại).
#    libltc KHÔNG cần (chỉ check khi USE_EXTERNAL_LIBS); libaaf là dead code.
#  - v9 (2026-10-12): FIX từ log vòng 6 — configure crash ValueError ở
#    gtk2_ardour/wscript: `int(conf.env['MAJOR'])` với MAJOR = chuỗi
#    "fatal: No names found, cannot describe anything." Vì wscript lấy version
#    từ `git describe HEAD` mà checkout của Actions không có tag nào.
#    Thêm step `git tag 8.12` trước configure.
#  - v10 (2026-10-12): FIX từ log vòng 7 — tag nhẹ không đủ: `git describe`
#    (wscript gọi không có --tags) chỉ nhận annotated tag. Đổi thành
#    `git tag -a 8.12 -m "KonpeitoArdour 8.12".
#  - v11 (2026-10-12): FIX từ log vòng 8 — runner chưa có danh tính git nên
#    không tạo được annotated tag ("Committer identity unknown"). Thêm
#    `git config user.email/name` tạm trước khi tag.
#  - v12 (2026-10-12): FIX từ chẩn đoán vòng 10 (build fail sau 12 phút, chưa
#    đọc được log chi tiết): thêm `--cxx17` cho waf configure. Không có flag
#    này, GCC 16 biên dịch code Ardour 8.x (kỷ nguyên C++17) dưới chuẩn mặc
#    định gnu++23; ngoài `-std=c++17`, flag này còn bật thêm _USE_MATH_DEFINES
#    và WIN32 trên mingw (wscript dòng 1235).
#  - v13 (2026-10-12): tee output `./waf -j` ra build/build.log, gzip + upload
#    artifact 'waf-build-log' khi fail (job log không đọc được qua API ẩn danh).
#  - v14 (2026-10-12): FIX từ log vòng 11 (đọc được nhờ link SAS anh gửi) —
#    link fail `cannot find -ljack64` ở task portaudio_callback_backend:
#    wscript link cứng jack64 trên mingw. Thêm gói mingw-w64-ucrt-x86_64-jack2
#    (đã verify tồn tại + có jack64.dll.a).
#  - v15 (2026-10-12): FIX từ log vòng 12 — task 'ardour-8.12.0' (link exe
#    chính) fail mà waf không in lỗi gì. Thêm step 'Retry failed task
#    verbosely' (chỉ chạy khi fail): chạy lại `waf -j1 -v`, incremental nên
#    chỉ làm lại task fail, -v để thấy full lệnh + lỗi thật trong log.
#  - v16 (2026-10-12): từ kết quả vòng 13 — build song song fail ở task link
#    cuối nhưng retry serial xong trong ~5p -> nghi flaky do thiếu RAM khi
#    link song song. Gộp retry vào step Build: song song fail thì tự retry
#    serial (verbose), chỉ fail job khi serial cũng fail. Xóa step retry rời
#    (v15) vì `|| true` che mất exit code thật.
#  - v17 (2026-10-12): FIX từ test thực tế của anh — bản portable chạy báo
#    thiếu DLL (libglibmm, libglib, libsigc++, libstdc++...): bước đóng gói
#    chỉ zip output của `waf install` mà không kèm DLL runtime của UCRT64.
#    Thêm gói mingw-w64-ucrt-x86_64-ntldd + step 'Bundle MSYS2 runtime DLLs':
#    với mỗi .exe/.dll trong stage/, copy các dependency trong /ucrt64/bin
#    vào cùng thư mục binary đó.
#
#  - v18 (2026-10-12): FIX v17 — bundle DLL nhưng artifact vòng 16 vẫn đúng
#    330.8MB y hệt vòng 15 (không copy được DLL nào): ntldd là chương trình
#    Windows native nên in đường dẫn dạng D:/a/_temp/msys64/ucrt64/bin/...,
#    filter startswith("/ucrt64/bin") loại hết. Đổi sang substring "ucrt64/bin",
#    fail loudly nếu total==0, và verify libglib/libstdc++ nằm cạnh exe chính.
#
#  - v19 (2026-10-12): FIX từ log chạy thực tế của anh (vòng 17) — v18 copy
#    DLL vào MỖI thư mục binary, kể cả surfaces/: Ardour quét mọi .dll ở đó
#    làm control-surface plugin -> lỗi um sùm + load trùng libglib từ 2 path
#    -> corrupt GObject ("cannot register existing type") -> GUI không hiện.
#    Đổi sang: gom UNION tất cả DLL runtime, chỉ copy vào các thư mục chứa
#    .exe (Windows tìm DLL của plugin ở thư mục exe). Verify thêm libwebsockets.
#
# ĐIỂM CHƯA CHẮC (sẽ iterate theo log CI):
#  - ytk/ytkmm (fork GTK của Ardour) nằm sẵn trong libs/tk nên không cần
#    gtkmm hệ thống; cairo/cairomm/pango/pangomm/libpng/fontconfig vẫn cần.
#  - drmingw: wscript bắt buộc exchndl.h khi --dist-target=mingw trừ khi truyền
#    --no-dr-mingw. Nếu configure vẫn báo thiếu -> thêm --no-dr-mingw.
#  - Zip portable chưa gom DLL runtime MinGW (libgcc, libwinpthread...). Nếu exe
#    không khởi động được -> bước tiếp theo dùng ntldd/ldd gom DLL vào bin/.
#  - Chưa bật ccache; chưa code-sign (SmartScreen sẽ cảnh báo khi chạy .exe).

name: Build Windows (Konpeito Ardour)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            zip

      - name: Install build dependencies (pacman)
        run: |
          set -x
          set -euo pipefail
          # Mirror MSYS2 trên runner đôi khi chậm/rớt giữa chừng
          # ("Operation too slow" -> pacman huỷ cả transaction -> mất toolchain).
          # Retry tối đa 3 lần + tắt download timeout khó tính.
          for attempt in 1 2 3; do
            if pacman -S --needed --noconfirm --disable-download-timeout \
              mingw-w64-ucrt-x86_64-toolchain \
              mingw-w64-ucrt-x86_64-python \
              mingw-w64-ucrt-x86_64-pkgconf \
              mingw-w64-ucrt-x86_64-glib2 \
              mingw-w64-ucrt-x86_64-glibmm \
              mingw-w64-ucrt-x86_64-cairo \
              mingw-w64-ucrt-x86_64-cairomm \
              mingw-w64-ucrt-x86_64-pango \
              mingw-w64-ucrt-x86_64-pangomm \
              mingw-w64-ucrt-x86_64-atk \
              mingw-w64-ucrt-x86_64-fontconfig \
              mingw-w64-ucrt-x86_64-libpng \
              mingw-w64-ucrt-x86_64-libxml2 \
              mingw-w64-ucrt-x86_64-gettext \
              mingw-w64-ucrt-x86_64-libsndfile \
              mingw-w64-ucrt-x86_64-flac \
              mingw-w64-ucrt-x86_64-curl \
              mingw-w64-ucrt-x86_64-libarchive \
              mingw-w64-ucrt-x86_64-liblo \
              mingw-w64-ucrt-x86_64-taglib \
              mingw-w64-ucrt-x86_64-vamp-plugin-sdk \
              mingw-w64-ucrt-x86_64-rubberband \
              mingw-w64-ucrt-x86_64-fftw \
              mingw-w64-ucrt-x86_64-aubio \
              mingw-w64-ucrt-x86_64-fluidsynth \
              mingw-w64-ucrt-x86_64-portaudio \
              mingw-w64-ucrt-x86_64-libusb \
              mingw-w64-ucrt-x86_64-hidapi \
              mingw-w64-ucrt-x86_64-libwebsockets \
              mingw-w64-ucrt-x86_64-drmingw \
              mingw-w64-ucrt-x86_64-boost \
              mingw-w64-ucrt-x86_64-lv2 \
              mingw-w64-ucrt-x86_64-serd \
              mingw-w64-ucrt-x86_64-sord \
              mingw-w64-ucrt-x86_64-sratom \
              mingw-w64-ucrt-x86_64-lilv \
              mingw-w64-ucrt-x86_64-jack2 \
              mingw-w64-ucrt-x86_64-ntldd; then
              break
            fi
            echo "WARNING: pacman attempt $attempt failed, retrying in 15s..."
            sleep 15
          done

      - name: Show toolchain versions
        run: |
          set -x
          set -euo pipefail
          # Fail nhanh, đúng chỗ nếu toolchain thiếu (command -v không bị
          # pipe che như `gcc --version | head -1`).
          command -v gcc
          command -v g++
          command -v windres
          command -v pkg-config
          command -v python3
          gcc --version | head -1
          python3 --version
          pkg-config --version
          pacman -Q mingw-w64-ucrt-x86_64-libwebsockets mingw-w64-ucrt-x86_64-drmingw

      - name: Tag HEAD for version detection
        run: |
          set -x
          set -euo pipefail
          # wscript lấy MAJOR.MINOR từ `git describe HEAD`, mà checkout của
          # Actions không có tag nào -> describe fail, MAJOR thành chuỗi
          # "fatal: No names found..." -> crash ValueError ở gtk2_ardour/wscript.
          # Tag HEAD để version parse được (codebase dòng Ardour 8.x).
          # Phải là annotated tag (-a): `git describe` (wscript gọi đúng kiểu
          # này, không có --tags) chỉ nhận annotated tag, tag nhẹ bị bỏ qua.
          # Runner chưa có danh tính git -> config tạm để tạo được tag.
          git config user.email "ci@konpeito-ardour.local"
          git config user.name "KonpeitoArdour CI"
          git tag -a 8.12 -m "KonpeitoArdour 8.12"
          git describe HEAD

      - name: Configure (waf, mingw target)
        run: |
          set -x
          set -euo pipefail
          # Ép waf dùng MinGW GCC bằng flag --check-c-compiler /
          # --check-cxx-compiler (waf trên win32 thử msvc -> gcc -> clang,
          # bỏ qua env khi chọn compiler — verify trên source waf 2.0.26).
          # TUYỆT ĐỐI KHÔNG export CC=gcc / CXX=g++: waf find_program() thấy
          # $CC thì dùng luôn chuỗi đó làm path, mà check_exe() trên win32
          # KHÔNG tự thêm .exe -> "not found" dù gcc.exe có trong PATH.
          python3 ./waf configure \
            --check-c-compiler=gcc \
            --check-cxx-compiler=g++ \
            --cxx17 \
            --dist-target=mingw \
            --program-name=KonpeitoArdour \
            --prefix=/

      - name: Build
        run: |
          set -x
          set -uo pipefail
          # Vòng 13: build song song (-j4) gãy ở task link cuối 'ardour-8.12.0'
          # mà không in lỗi gì, nhưng chạy lại serial (-j1 -v) thì xong trong
          # ~5 phút -> nghi là lỗi flaky của build song song (thiếu RAM khi
          # link nhiều DLL/exe cùng lúc trên runner 16GB), không phải lỗi code.
          # Thử song song trước cho nhanh; fail thì tự retry serial, chỉ fail
          # job khi serial cũng fail. Không dùng `set -e` để `if` bắt được
          # exit code của waf qua pipefail.
          if ! python3 ./waf -j$(nproc) 2>&1 | tee build/build.log; then
            echo 'Parallel build failed -> retrying serially (verbose)'
            python3 ./waf -j1 -v 2>&1 | tee -a build/build.log
          fi

      - name: Install to staging dir
        run: |
          set -x
          set -euo pipefail
          rm -rf stage
          python3 ./waf install --destdir="$PWD/stage"

      - name: Bundle MSYS2 runtime DLLs
        run: |
          set -x
          set -euo pipefail
          # Bản portable phải mang theo DLL của UCRT64 (glib, stdc++...),
          # nếu không exe báo "was not found" khi chạy ngoài môi trường MSYS2.
          # Với mỗi .exe/.dll trong stage/, dùng ntldd liệt kê dependency nằm
          # trong /ucrt64/bin rồi copy vào cùng thư mục với binary đó (Windows
          # tìm DLL trước hết ở thư mục của exe đang chạy).
          # Gom UNION tất cả DLL runtime của mọi binary, chỉ copy vào các thư mục
          # chứa .exe (Windows tìm DLL của plugin ở thư mục của exe, không phải
          # thư mục của plugin). KHÔNG rải DLL vào thư mục plugin (surfaces/,
          # backends/...): Ardour quét mọi .dll ở đó làm plugin -> vừa báo lỗi
          # um sùm, vừa load trùng libglib từ 2 path -> corrupt GObject type
          # system -> GUI không hiện (bệnh vòng 17).
          python3 - <<'EOF'
          import os, subprocess, shutil, sys
          stage = os.path.abspath("stage")
          def deps_of(path):
              out = subprocess.run(["ntldd", "-R", path],
                                   capture_output=True, text=True).stdout
              deps = []
              for line in out.splitlines():
                  if "=>" in line:
                      # ntldd (native Windows) in ra đường dẫn dạng
                      # D:/a/_temp/msys64/ucrt64/bin/..., không phải /ucrt64/bin
                      dep = line.split("=>", 1)[1].strip().split()[0].replace("\\", "/")
                      if "ucrt64/bin" in dep.lower() and os.path.isfile(dep):
                          deps.append(dep)
              return deps
          union = set()
          exe_dirs = set()
          for root, dirs, files in os.walk(stage):
              for f in files:
                  if f.lower().endswith((".exe", ".dll")):
                      p = os.path.join(root, f)
                      union.update(deps_of(p))
                      if f.lower().endswith(".exe"):
                          exe_dirs.add(root)
          print(f"Found {len(union)} unique runtime DLLs, {len(exe_dirs)} exe dirs")
          if not union:
              print("ERROR: no DLLs found, aborting", file=sys.stderr)
              sys.exit(1)
          total = 0
          for d in sorted(exe_dirs):
              for dep in sorted(union):
                  dst = os.path.join(d, os.path.basename(dep))
                  if not os.path.exists(dst):
                      shutil.copy2(dep, dst)
                      total += 1
          print(f"Bundled {total} DLL copies")
          EOF
          # Kiểm tra chắc chắn: DLL quan trọng phải nằm cạnh exe chính
          EXEDIR=$(dirname "$(find stage -name 'ardour-8.12.0.exe' | head -1)")
          echo "Main exe dir: $EXEDIR"
          ls "$EXEDIR/libglib-2.0-0.dll" "$EXEDIR/libstdc++-6.dll" "$EXEDIR/libwebsockets.dll"

      - name: Zip portable package
        run: |
          set -x
          set -euo pipefail
          cd stage
          zip -qr ../KonpeitoArdour-Windows.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: KonpeitoArdour-Windows
          path: KonpeitoArdour-Windows.zip
          if-no-files-found: error

      - name: Upload waf config.log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: waf-config-log
          path: build/config.log
          if-no-files-found: warn

      - name: Compress build log on failure
        if: failure()
        run: |
          set -x
          gzip -9 -f build/build.log || true

      - name: Upload waf build log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: waf-build-log
          path: build/build.log.gz
          if-no-files-found: warn
